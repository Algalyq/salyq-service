name: Build & Deploy

on:
  push:
    branches:
      - master
      - test

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Set deploy vars
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "port=8500" >> $GITHUB_OUTPUT
            echo "container=salyq-service-master" >> $GITHUB_OUTPUT
          else
            echo "tag=test" >> $GITHUB_OUTPUT
            echo "port=8501" >> $GITHUB_OUTPUT
            echo "container=salyq-service-test" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: |
          docker pull ghcr.io/algalyq/salyq-service:${{ steps.vars.outputs.tag }}

      - name: Stop old container
        run: |
          docker stop ${{ steps.vars.outputs.container }} || true
          docker rm ${{ steps.vars.outputs.container }} || true

      - name: Deploy container
        run: |
          docker run -d \
            --name ${{ steps.vars.outputs.container }} \
            --restart unless-stopped \
            --add-host=host.docker.internal:host-gateway \
            -p ${{ steps.vars.outputs.port }}:8000 \
            -e JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }} \
            -e KALKAN_URL=http://host.docker.internal:8504 \
            -e KASPI_POS_URL=http://host.docker.internal:8506 \
            -e KASPI_POS_TOKEN_SN=${{ secrets.KASPI_POS_TOKEN_SN }} \
            -e KASPI_POS_VTOKEN_SECRET=${{ secrets.KASPI_POS_VTOKEN_SECRET }} \
            -e KASPI_POS_PROFILE_ID=${{ secrets.KASPI_POS_PROFILE_ID }} \
            -e KASPI_WEBHOOK_SECRET=${{ secrets.KASPI_WEBHOOK_SECRET }} \
            -e SERVICE_FEE_AMOUNT=${{ vars.SERVICE_FEE_AMOUNT || '2000' }} \
            -e CORS_ORIGINS=${{ vars.CORS_ORIGINS || 'https://salyq.gulzar.kz,https://salyq-test.gulzar.kz' }} \
            -e KGD_SMARTBRIDGE_ENABLED=false \
            -e DATABASE_URL=postgresql+psycopg://${{ secrets.POSTGRES_USER || 'salyq' }}:${{ secrets.POSTGRES_PASSWORD || 'salyq' }}@${{ vars.POSTGRES_HOST || 'host.docker.internal' }}:5432/${{ secrets.POSTGRES_DB || 'salyq' }} \
            ghcr.io/algalyq/salyq-service:${{ steps.vars.outputs.tag }}

      - name: Cleanup old images
        run: docker image prune -f || true
