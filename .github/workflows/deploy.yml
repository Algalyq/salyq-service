name: Build & Deploy

on:
  push:
    branches:
      - master
      - test

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t salyq-service:${{ github.ref_name }} .

      - name: Save Docker image
        run: |
          docker save salyq-service:${{ github.ref_name }} -o salyq-service.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: salyq-service-image
          path: salyq-service.tar
          retention-days: 1

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: salyq-service-image

      - name: Load Docker image
        run: |
          docker load -i salyq-service.tar

      - name: Tag as latest
        run: |
          docker tag salyq-service:${{ github.ref_name }} salyq-service:latest

      - name: Deploy container
        run: |
          docker stop salyq-service-${{ github.ref_name }} || true
          docker rm salyq-service-${{ github.ref_name }} || true

          docker run -d \
            --name salyq-service-${{ github.ref_name }} \
            --restart unless-stopped \
            -p ${{ github.ref_name == 'master' && '8000:8000' || '8001:8000' }} \
            -e JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }} \
            -e KALKAN_URL=http://localhost:8002 \
            -e KASPI_POS_URL=http://localhost:3001 \
            -e KASPI_POS_TOKEN_SN=${{ secrets.KASPI_POS_TOKEN_SN }} \
            -e KASPI_POS_VTOKEN_SECRET=${{ secrets.KASPI_POS_VTOKEN_SECRET }} \
            -e KASPI_POS_PROFILE_ID=${{ secrets.KASPI_POS_PROFILE_ID }} \
            -e KASPI_WEBHOOK_SECRET=${{ secrets.KASPI_WEBHOOK_SECRET }} \
            -e SERVICE_FEE_AMOUNT=${{ vars.SERVICE_FEE_AMOUNT || '2000' }} \
            -e CORS_ORIGINS=${{ vars.CORS_ORIGINS || 'http://localhost:3000' }} \
            -e KGD_SMARTBRIDGE_ENABLED=false \
            salyq-service:${{ github.ref_name }}

      - name: Cleanup artifact
        run: rm -f salyq-service.tar
